<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #03070d;
    --cyan: #3fe0ff;
    --cyan-dim: rgba(63, 224, 255, 0.35);
    --cyan-faint: rgba(63, 224, 255, 0.08);
    --text: #cfefff;
    --muted: #6d8da0;
    --warn: #ffb347;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #0a1f2e 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Rajdhani", system-ui, sans-serif;
    font-size: 18px;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  /* faint grid */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  header {
    width: 100%; max-width: 900px; padding: 18px 20px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Orbitron", sans-serif; letter-spacing: 0.25em; font-size: 13px; color: var(--muted);
  }
  header .title { color: var(--cyan); font-weight: 700; text-shadow: 0 0 12px var(--cyan-dim); }
  #clock { font-variant-numeric: tabular-nums; }

  .core {
    position: relative; width: min(46vh, 320px); aspect-ratio: 1; margin-top: 10px; flex-shrink: 0;
  }
  .core canvas { width: 100%; height: 100%; display: block; }
  .core .label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Orbitron", sans-serif; font-size: 13px; letter-spacing: 0.35em; color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
    pointer-events: none; text-transform: uppercase;
  }

  #log {
    width: 100%; max-width: 760px; flex: 1; overflow-y: auto; padding: 8px 20px 12px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: var(--cyan-dim) transparent;
  }
  .msg { max-width: 85%; line-height: 1.4; padding: 10px 14px; border-radius: 4px; animation: in .3s ease; }
  .msg .who { font-family: "Orbitron", sans-serif; font-size: 10px; letter-spacing: 0.25em; margin-bottom: 4px; opacity: .7; }
  .msg.jarvis { align-self: flex-start; border-left: 2px solid var(--cyan); background: linear-gradient(90deg, rgba(63,224,255,.10), transparent); }
  .msg.jarvis .who { color: var(--cyan); }
  .msg.user { align-self: flex-end; text-align: right; border-right: 2px solid var(--muted); background: linear-gradient(270deg, rgba(160,190,210,.08), transparent); }
  .msg.error { align-self: center; color: var(--warn); font-size: 15px; border: 1px solid rgba(255,179,71,.3); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  form {
    width: 100%; max-width: 760px; padding: 12px 20px 22px;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1; background: rgba(5, 20, 30, .8); border: 1px solid var(--cyan-dim); color: var(--text);
    font: inherit; padding: 12px 16px; border-radius: 4px; outline: none;
  }
  #input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-faint), 0 0 18px var(--cyan-faint); }
  #input::placeholder { color: var(--muted); }
  button {
    background: transparent; border: 1px solid var(--cyan-dim); color: var(--cyan);
    font-family: "Orbitron", sans-serif; font-size: 12px; letter-spacing: .2em;
    padding: 0 16px; border-radius: 4px; cursor: pointer; transition: all .2s;
  }
  button:hover:not(:disabled) { background: var(--cyan-faint); border-color: var(--cyan); box-shadow: 0 0 14px var(--cyan-faint); }
  button:disabled { opacity: .4; cursor: default; }
  #mic { width: 48px; padding: 0; display: grid; place-items: center; }
  #mic svg { width: 20px; height: 20px; }
  #mic.on { background: rgba(63,224,255,.18); border-color: var(--cyan); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { box-shadow: 0 0 20px var(--cyan-dim); } }

  #mute { font-size: 10px; padding: 6px 10px; }
</style>
</head>
<body>
  <header>
    <span class="title">J.A.R.V.I.S.</span>
    <span id="clock">--:--:--</span>
    <button id="mute" type="button" title="Toggle voice">VOICE: ON</button>
  </header>

  <div class="core">
    <canvas id="ring" width="640" height="640"></canvas>
    <div class="label" id="status">Online</div>
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <button id="mic" type="button" title="Speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="input" placeholder="Speak, or type a command…" />
    <button id="send" type="submit">SEND</button>
  </form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), statusEl = $("status"), sendBtn = $("send"), micBtn = $("mic");
const history = [];
let state = "idle";      // idle | listening | thinking | speaking
let voiceOn = true;
let level = 0;           // audio level 0..1 used by the ring

// ---------- Clock ----------
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); }, 1000);

// ---------- UI helpers ----------
function setState(s) {
  state = s;
  statusEl.textContent = { idle: "Online", listening: "Listening", thinking: "Processing", speaking: "Speaking" }[s];
  const busy = s === "thinking" || s === "speaking";
  sendBtn.disabled = busy; input.disabled = s === "thinking";
}
function addMsg(who, text) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  if (who !== "error") {
    const tag = document.createElement("div");
    tag.className = "who"; tag.textContent = who === "jarvis" ? "JARVIS" : "YOU";
    el.appendChild(tag);
  }
  el.appendChild(document.createTextNode(text));
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

// ---------- Talk to JARVIS ----------
async function ask(text) {
  text = text.trim();
  if (!text || state === "thinking") return;
  stopAudio();
  addMsg("user", text);
  history.push({ role: "user", content: text });
  setState("thinking");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    history.push({ role: "assistant", content: data.reply });
    addMsg("jarvis", data.reply);
    if (voiceOn) await speak(data.reply); else setState("idle");
  } catch (e) {
    history.pop();
    addMsg("error", "System fault: " + e.message);
    setState("idle");
  }
}

// ---------- Voice (Fish Audio via /api/speak) ----------
const audio = new Audio();
let audioCtx, analyser, dataArr;
function setupAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArr = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); analyser.connect(audioCtx.destination);
}
async function speak(text) {
  try {
    const r = await fetch("/api/speak", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Voice unavailable"); }
    const blob = await r.blob();
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(blob);
    setupAnalyser();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    setState("speaking");
    await audio.play();
  } catch (e) {
    addMsg("error", e.message);
    setState("idle");
  }
}
function stopAudio() { if (!audio.paused) { audio.pause(); audio.currentTime = 0; } }
audio.addEventListener("ended", () => setState("idle"));

$("mute").onclick = () => {
  voiceOn = !voiceOn;
  $("mute").textContent = "VOICE: " + (voiceOn ? "ON" : "OFF");
  if (!voiceOn) { stopAudio(); if (state === "speaking") setState("idle"); }
};

// ---------- Microphone (browser speech recognition) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec;
if (SR) {
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  rec.onresult = (e) => {
    const t = Array.from(e.results).map((r) => r[0].transcript).join("");
    input.value = t;
    if (e.results[e.results.length - 1].isFinal) { input.value = ""; ask(t); }
  };
  rec.onend = () => { micBtn.classList.remove("on"); if (state === "listening") setState("idle"); };
  rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") addMsg("error", "Microphone: " + e.error); };
  micBtn.onclick = () => {
    if (micBtn.classList.contains("on")) { rec.stop(); return; }
    stopAudio();
    try { rec.start(); micBtn.classList.add("on"); setState("listening"); } catch {}
  };
} else {
  micBtn.disabled = true;
  micBtn.title = "Voice input needs Chrome or Edge";
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = input.value; input.value = ""; ask(t); });

// ---------- Arc-reactor ring animation ----------
const cv = $("ring"), ctx = cv.getContext("2d");
const C = cv.width / 2;
let t = 0;
function draw() {
  t += 0.016;
  // audio level
  let target = 0;
  if (state === "speaking" && analyser) {
    analyser.getByteFrequencyData(dataArr);
    target = dataArr.reduce((a, b) => a + b, 0) / dataArr.length / 140;
  } else if (state === "thinking") target = 0.25 + 0.15 * Math.sin(t * 6);
  else if (state === "listening") target = 0.2 + 0.1 * Math.sin(t * 3);
  else target = 0.06 + 0.04 * Math.sin(t * 1.5);
  level += (Math.min(target, 1) - level) * 0.18;

  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.translate(C, C);
  ctx.shadowColor = "#3fe0ff"; ctx.shadowBlur = 18 + level * 40;

  // core glow
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 120 + level * 60);
  g.addColorStop(0, `rgba(160,245,255,${0.55 + level * 0.4})`);
  g.addColorStop(0.4, `rgba(63,224,255,${0.18 + level * 0.3})`);
  g.addColorStop(1, "rgba(63,224,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 200, 0, Math.PI * 2); ctx.fill();

  const ring = (r, w, a, segs, gap, rot) => {
    ctx.strokeStyle = `rgba(63,224,255,${a})`; ctx.lineWidth = w;
    const step = (Math.PI * 2) / segs;
    for (let i = 0; i < segs; i++) {
      ctx.beginPath(); ctx.arc(0, 0, r, rot + i * step, rot + (i + 1) * step - gap); ctx.stroke();
    }
  };
  const speed = state === "thinking" ? 3 : 1;
  ring(100 + level * 20, 4, 0.9, 1, 0, 0);
  ring(130 + level * 30, 10, 0.55, 12, 0.12, t * 0.6 * speed);
  ring(170 + level * 25, 2, 0.6, 3, 0.5, -t * 0.4 * speed);
  ring(200, 1.5, 0.35, 60, 0.06, t * 0.1);
  ring(250, 3, 0.4, 4, 0.9, -t * 0.25 * speed);

  // radial ticks that react to voice
  ctx.shadowBlur = 8;
  for (let i = 0; i < 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    const v = analyser && state === "speaking" ? dataArr[i % dataArr.length] / 255 : 0.15 + 0.1 * Math.sin(t * 2 + i);
    const r1 = 280, r2 = 280 + 8 + v * 30;
    ctx.strokeStyle = `rgba(63,224,255,${0.25 + v * 0.6})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.stroke();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
draw();

// ---------- Greeting ----------
const hour = new Date().getHours();
const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
addMsg("jarvis", `${greet}, sir. All systems are online. How may I assist you?`);
</script>
</body>
</html>
